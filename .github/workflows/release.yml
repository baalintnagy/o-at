name: Release

# Push a tag such as `v0.2.0` (matching the workspace version in Cargo.toml) to build,
# test and publish a release, or run the workflow by hand with a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version against Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then version="${TAG#v}"; else version="${INPUT#v}"; fi
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$manifest" ]; then
            echo "::error::Release version $version does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      PACKAGE: O-AT-${{ needs.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: o-at-windows-x64
          path: bundled
      - name: Assemble the package
        run: |
          mkdir -p "$PACKAGE/VST3" "$PACKAGE/CLAP"
          cp -r bundled/*.vst3 "$PACKAGE/VST3/"
          cp bundled/*.clap "$PACKAGE/CLAP/"
          cp bundled/*.exe "$PACKAGE/"
          cp packaging/INSTALL.txt README.md LICENSE NOTICE.md "$PACKAGE/"
          zip -r -9 "$PACKAGE.zip" "$PACKAGE"
          sha256sum "$PACKAGE.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: O-AT ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Windows x64 builds of O-NEC, O-AUD-TX and O-AUD-RX (VST3 and CLAP) and the
            standalone O-AUD-RX, O-AUD-TX and O-NEC applications. See INSTALL.txt in the
            archive.

            Distributed VST3 binaries include GPLv3-licensed VST3 bindings; see NOTICE.md.
          files: |
            ${{ env.PACKAGE }}.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
