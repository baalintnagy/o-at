name: Release

# Push a tag such as `v0.2.0` (matching the workspace version in Cargo.toml) to build,
# test and publish a release, or run the workflow by hand with a version.
#
# Releases include Windows and Linux packages. For a Windows-only release, write
# `windows-only` in the annotated tag's message (git tag -a v0.2.1 -m "v0.2.1 windows-only")
# or untick Linux when running the workflow by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.2.0)"
        required: true
      linux:
        description: "Also build and publish the Linux package"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      linux: ${{ steps.platforms.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version against Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then version="${TAG#v}"; else version="${INPUT#v}"; fi
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$manifest" ]; then
            echo "::error::Release version $version does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Choose the platforms
        id: platforms
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          LINUX: ${{ inputs.linux }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The checkout may hold the tag without its annotation.
            git fetch --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
            message=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
            case "$message" in
              *windows-only*) linux=false ;;
              *) linux=true ;;
            esac
          else
            linux=$LINUX
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "Linux package: $linux"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      linux: ${{ needs.version.outputs.linux == 'true' }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      WINDOWS: O-AT-${{ needs.version.outputs.version }}-windows-x64
      LINUX: O-AT-${{ needs.version.outputs.version }}-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: o-at-windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.linux == 'true'
        with:
          name: o-at-linux-x64
          path: linux-archive
      - name: Assemble the Windows package
        run: |
          mkdir -p "$WINDOWS/VST3" "$WINDOWS/CLAP"
          cp -r windows/*.vst3 "$WINDOWS/VST3/"
          cp windows/*.clap "$WINDOWS/CLAP/"
          cp windows/*.exe "$WINDOWS/"
          cp packaging/INSTALL.txt README.md LICENSE NOTICE.md "$WINDOWS/"
          zip -r -9 "$WINDOWS.zip" "$WINDOWS"
      - name: Assemble the Linux package
        if: needs.version.outputs.linux == 'true'
        run: |
          mkdir -p linux "$LINUX/VST3" "$LINUX/CLAP"
          tar -C linux -xf linux-archive/o-at-linux-x64.tar
          cp -r linux/*.vst3 "$LINUX/VST3/"
          cp linux/*.clap "$LINUX/CLAP/"
          for app in O-AUD-RX O-AUD-TX O-AUD-A-standalone O-NEC-standalone O-NR-standalone; do
            install -m 755 "linux/$app" "$LINUX/$app"
          done
          cp packaging/INSTALL-linux.txt "$LINUX/INSTALL.txt"
          cp README.md LICENSE NOTICE.md "$LINUX/"
          tar -czf "$LINUX.tar.gz" "$LINUX"
      - name: Checksums and release notes
        id: assets
        env:
          WITH_LINUX: ${{ needs.version.outputs.linux }}
        run: |
          packages="$WINDOWS.zip"
          platforms="Windows x64"
          if [ "$WITH_LINUX" = "true" ]; then
            packages="$packages $LINUX.tar.gz"
            platforms="Windows x64 and Linux x64"
          fi
          sha256sum $packages > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "files<<EOF"
            for file in $packages SHA256SUMS.txt; do echo "$file"; done
            echo "EOF"
            echo "body<<EOF"
            echo "$platforms builds of O-NEC, O-NR, O-AUD-TX, O-AUD-RX and O-AUD-A (VST3 and"
            echo "CLAP) and the standalone O-AUD-RX, O-AUD-TX, O-AUD-A, O-NEC and O-NR"
            echo "applications. See INSTALL.txt in each archive."
            if [ "$WITH_LINUX" = "true" ]; then
              echo "The Linux build needs glibc 2.35 or later (Ubuntu 22.04, Debian 12)."
            else
              echo "This release has no Linux package; the latest Linux package is in an"
              echo "earlier release."
            fi
            echo
            echo "Distributed VST3 binaries include GPLv3-licensed VST3 bindings; see NOTICE.md."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: O-AT ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: ${{ steps.assets.outputs.body }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
