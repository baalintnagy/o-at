[workspace]
members = ["xtask", "crates/*"]
exclude = ["vendor"]
resolver = "3"

# Shared by the member crates. `version` is the release version: release tags `vX.Y.Z`
# must match it.
[workspace.package]
version = "0.6.2"
edition = "2024"
# Minimum supported Rust version, checked by CI's `msrv` job. The editors use let-chains
# (1.88); the locked dependencies need 1.87 (rubato 5.1). The pinned toolchain that builds
# the releases is in rust-toolchain.toml.
rust-version = "1.88"
authors = ["baalintnagy"]
license = "MIT"

# NIH-plug's `nih_plug` crate at the pinned revision (de42101) with a fix for the
# standalone audio input; see vendor/README.md. Remove this once upstream has the fix.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih_plug" }

# DeepFilterNet inference is far too slow unoptimized; debug builds of O-NEC itself keep
# their assertions and allocation checks.
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-pulse]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
