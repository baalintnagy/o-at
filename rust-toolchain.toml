# The toolchain that builds, lints and releases O-AT, here and in CI. Raise it
# deliberately: newer Clippy versions add lints that CI treats as errors. The minimum
# supported version is `rust-version` in the root Cargo.toml, which CI checks separately.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
