[package]
name = "audbus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Named inter-process audio buses over shared memory, for O-AUD-TX and O-AUD-RX"
publish = false

[dependencies]
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["backtrace", "log"] }
rt-check = { path = "../rt-check" }
