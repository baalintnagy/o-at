[package]
name = "o-aud-tx"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["baalintnagy"]
license = "MIT"
description = "O-AUD-TX: sends audio to a named audio bus, as a plugin and as the core of the standalone transmitter"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["plugin"]
# The shared egui editor body.
view = ["dep:egui", "dep:aud-ui"]
# The VST3 and CLAP plugin.
plugin = ["view", "dep:nih_plug", "dep:nih_plug_egui", "aud-ui/nih-plug"]

[dependencies]
audbus = { path = "../audbus" }
aud-ui = { path = "../aud-ui", optional = true }
egui = { version = "0.31", default-features = false, optional = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", features = ["assert_process_allocs"], optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", optional = true }

[build-dependencies]
# Embeds the icon and version information in Windows executables.
winresource = "0.1"

[dev-dependencies]
cpal = "0.15"
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["backtrace", "log"] }
