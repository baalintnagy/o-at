[package]
name = "o-aud-rx-app"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["baalintnagy"]
license = "MIT"
description = "Standalone O-AUD-RX: plays a named audio bus on any output device"
publish = false

[[bin]]
name = "o-aud-rx"
path = "src/main.rs"

[dependencies]
o-aud-rx = { path = "../o-aud-rx", default-features = false, features = ["view"] }
aud-ui = { path = "../aud-ui" }
# Same revisions as nih_plug_egui, so the editor code is shared with the plugins.
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
egui = { version = "0.31", default-features = false }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0" }
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi"] }

[build-dependencies]
# Embeds the icon and version information in Windows executables.
winresource = "0.1"
