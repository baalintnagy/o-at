[package]
name = "o-nr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "O-NR (Open Noise Reduction): noise profile based denoiser for any material"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "o-nr-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
# Standalone application for trying the plugin without a host.
standalone = ["nih_plug/standalone"]

[dependencies]
aud-ui = { path = "../aud-ui", features = ["nih-plug"] }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101" }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
triple_buffer = "9.0"

[build-dependencies]
# Embeds the icon and version information in Windows executables.
winresource = "0.1"

[dev-dependencies]
rt-check = { path = "../rt-check" }
serde_json = "1"
