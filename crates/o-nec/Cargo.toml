[package]
name = "o-nec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "O-NEC (Open Noise and Echo Cancelation) voice cleanup audio plugin"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "o-nec-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
# Standalone application for trying the plugin without a host.
standalone = ["nih_plug/standalone"]

[dependencies]
aud-ui = { path = "../aud-ui", features = ["nih-plug"] }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de42101" }
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet 0.5.6 (libDF) with the embedded DeepFilterNet3 model. Not published on
# crates.io in this version, so it is pinned to the release tag's commit.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
# Must match the ndarray version used by deep_filter.
ndarray = "0.15"
rtrb = "0.3"
realfft = "3.5"
rubato = "5.1"
triple_buffer = "9.0"
biquad = "0.6"

[build-dependencies]
# Embeds the icon and version information in Windows executables.
winresource = "0.1"

[dev-dependencies]
rt-check = { path = "../rt-check" }
